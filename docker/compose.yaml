# Local development stack (plan step 0.2). Dev-only credentials come from the repo-root .env
# (see .env.example); the defaults below are for a throwaway local database only.
name: ledgerly

services:
  postgres:
    image: postgres:16-alpine
    # Local data is disposable: skip disk flushes, which otherwise dominate test time (TRUNCATE per test).
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LEDGERLY_PG_SUPERUSER_PASSWORD:-postgres}
      LEDGERLY_OWNER_PASSWORD: ${LEDGERLY_OWNER_PASSWORD:-owner_dev}
      LEDGERLY_APP_PASSWORD: ${LEDGERLY_APP_PASSWORD:-app_dev}
      LEDGERLY_REPORT_PASSWORD: ${LEDGERLY_REPORT_PASSWORD:-report_dev}
      LEDGERLY_PLATFORM_PASSWORD: ${LEDGERLY_PLATFORM_PASSWORD:-platform_dev}
    ports:
      - "${LEDGERLY_PG_PORT:-54316}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${LEDGERLY_REDIS_PORT:-63796}:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${LEDGERLY_MAILPIT_UI_PORT:-18025}:8025"
      - "${LEDGERLY_MAILPIT_SMTP_PORT:-11025}:1025"

  # --- Application stack: `make up-app` (compose profile "app"). Not started by `make up`. ---
  php-fpm:
    profiles: ["app"]
    build:
      context: ./php
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      QUEUE_CONNECTION: database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Queue worker for document PDFs and report exports (`exports`) and document emails (`mail`). Chromium, node and the
  # puppeteer module live in this image, not in php-fpm: a web process never renders a PDF (plan 3c.4, docs/06 Phase 4 ops).
  exports:
    profiles: ["app"]
    build:
      context: ./worker
    command: php artisan queue:work --queue=exports,mail --tries=1 --timeout=120 --max-time=3600 --sleep=2
    restart: unless-stopped
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: database
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    ports:
      - "${LEDGERLY_WEB_PORT:-18080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/frontend/dist:ro
      - ../backend/public:/var/www/backend/public:ro
    depends_on:
      - php-fpm

  minio:
    profiles: ["app"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LEDGERLY_MINIO_USER:-ledgerly_dev}
      MINIO_ROOT_PASSWORD: ${LEDGERLY_MINIO_PASSWORD:-ledgerly_dev_secret}
    ports:
      - "${LEDGERLY_MINIO_PORT:-19000}:9000"
      - "${LEDGERLY_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - miniodata:/data

  clamav:
    profiles: ["app"]
    image: clamav/clamav:stable
    ports:
      - "${LEDGERLY_CLAMAV_PORT:-13310}:3310"
    volumes:
      - clamdata:/var/lib/clamav

volumes:
  pgdata:
  miniodata:
  clamdata:
